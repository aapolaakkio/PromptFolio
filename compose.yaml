services:
  promptfolio:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      BASE_URL: ${BASE_URL:-http://localhost:3000}
      # No default: a self-hosted financial app booting with a guessable
      # or missing secret is a silent authentication bypass. See
      # src/server/auth.ts's resolveAuthSecret -- the process itself
      # already refuses to start below 32 characters; this just makes
      # Compose refuse just as loudly if .env is missing entirely.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set this in .env -- see .env.example}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
      # Optional, and empty by default: the assistant and the import-time
      # classification of new payees both call Anthropic's API. Without this
      # the container still runs -- chat answers 503 and classification is
      # skipped -- which is why it has a default where the auth secret does
      # not. Passed through explicitly all the same: a key sitting in .env
      # that Compose never forwards looks exactly like a broken feature.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Authorises POST /api/cron/refresh, the price and FX refresh. Nothing
      # inside the container schedules it: a timer only runs while the process
      # does, restarts its clock on every deploy, and fires twice if the app is
      # ever run twice. Point your own cron at the endpoint instead. Unset means
      # the endpoint refuses every call.
      CRON_SECRET: ${CRON_SECRET:-}
      # Log timestamps and any other new Date() formatting follow the container
      # clock, so it is set to match the household's.
      TZ: Europe/Helsinki
    volumes:
      - promptfolio-data:/data

volumes:
  promptfolio-data:
